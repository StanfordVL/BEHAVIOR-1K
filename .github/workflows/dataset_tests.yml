name: Dataset Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  run_dataset_test:
    name: Run Dataset Tests
    runs-on: [self-hosted, linux, gpu, dataset-enabled]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    strategy:
      fail-fast: false
      matrix:
        test_file:
          - test_2026_tasks
          - test_replay_data

    defaults:
      run:
        working-directory: ${{ github.workspace }}/OmniGibson

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install BDDL
        run: pip install -e .
        working-directory: ${{ github.workspace }}/bddl3

      - name: Install OmniGibson
        run: pip install -e .[dev,primitives,eval] --no-build-isolation

      - name: Checkout 2026 challenge task instances
        env:
          DEPLOY_KEY: ${{ secrets.DATASET_2026_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          echo "$DEPLOY_KEY" > ~/.ssh/2026_dataset_deploy_key
          chmod 600 ~/.ssh/2026_dataset_deploy_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/2026_dataset_deploy_key -o IdentitiesOnly=yes"
          DATA_PATH=$(python -c "from omnigibson.macros import gm; print(gm.DATA_PATH)")
          DEST="$DATA_PATH/2026-challenge-task-instances"
          if [ -d "$DEST/.git" ]; then
            git -C "$DEST" pull --ff-only
          else
            rm -rf "$DEST"
            git clone git@github.com:wensi-ai/2026-challenge-task-instances.git "$DEST"
          fi

      - name: Run tests
        run: >
          pytest -s tests/${{ matrix.test_file }}.py
          --junitxml=${{ matrix.test_file }}.xml
          -o junit_family=xunit1
        continue-on-error: true
        timeout-minutes: 60

      - name: Check for failures, errors, or missing XML
        if: always()
        run: |
          xml=${{ matrix.test_file }}.xml
          if [ ! -f "$xml" ]; then
            cat > "$xml" << 'EOF'
          <?xml version="1.0"?>
          <testsuite name="${{ matrix.test_file }}" errors="1" failures="0" tests="1">
            <testcase name="${{ matrix.test_file }}" classname="${{ matrix.test_file }}">
              <error message="Test did not produce output, likely due to segfault or timeout"/>
            </testcase>
          </testsuite>
          EOF
            echo "Error: XML file not found, probably due to segfault or timeout"
            exit 1
          elif grep -Eq 'failures="[1-9][0-9]*"|errors="[1-9][0-9]*"' "$xml"; then
            echo "Error: Test failures or errors found"
            exit 1
          else
            echo "All tests passed successfully"
          fi

      - name: Deploy artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.run_id }}-tests-${{ matrix.test_file }}
          path: OmniGibson/${{ matrix.test_file }}.xml
          overwrite: true
