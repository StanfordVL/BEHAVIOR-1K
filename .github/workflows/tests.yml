name: Tests

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  check_example_list:
    name: Check Example List Up To Date
    runs-on: [self-hosted, linux, gpu]
    defaults:
      run:
        working-directory: ${{ github.workspace }}/OmniGibson

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install BDDL
        run: pip install -e .
        working-directory: ${{ github.workspace }}/bddl3

      - name: Install OmniGibson
        run: pip install -e .[dev,primitives,eval] --no-build-isolation
      - name: Check example lists are up to date
        run: python tests/update_example_tests.py --check

  run_test:
    name: Run Tests
    runs-on: [self-hosted, linux, gpu, dataset-enabled]

    strategy:
      fail-fast: false
      matrix:
        # TEMPORARY: only run tests for examples modified in this PR. Restore full matrix before merging.
        include:
        # --- BEGIN AUTO-GENERATED EXAMPLE INCLUDES ---
          - {test_file: test_examples, example: "object_states.object_state_texture_demo"}
          - {test_file: test_examples, example: "object_states.particle_applier_remover_demo"}
          - {test_file: test_examples, example: "object_states.particle_source_sink_demo"}
        # --- END AUTO-GENERATED EXAMPLE INCLUDES ---

    defaults:
      run:
        working-directory: ${{ github.workspace }}/OmniGibson

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install BDDL
        run: pip install -e .
        working-directory: ${{ github.workspace }}/bddl3

      - name: Install OmniGibson
        run: pip install -e .[dev,primitives,eval] --no-build-isolation

      - name: Print env
        run: printenv

      - name: Run tests
        run: >
          pytest -s tests/${{ matrix.test_file }}.py
          ${{ matrix.example && format('-k "{0}"', matrix.example) || '' }}
          --junitxml=${{ matrix.test_file }}${{ matrix.example && format('_{0}', matrix.example) || '' }}.xml
        continue-on-error: true
        timeout-minutes: 30

      - name: Deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.run_id }}-tests-${{ matrix.test_file }}${{ matrix.example && format('-{0}', matrix.example) || '' }}
          path: OmniGibson/${{ matrix.test_file }}${{ matrix.example && format('_{0}', matrix.example) || '' }}.xml

      - name: Check for failures, errors, or missing XML
        run: |
          xml=${{ matrix.test_file }}${{ matrix.example && format('_{0}', matrix.example) || '' }}.xml
          if [ ! -f "$xml" ]; then
            echo "Error: XML file not found, probably due to segfault"
            exit 1
          elif grep -Eq 'failures="[1-9][0-9]*"|errors="[1-9][0-9]*"' "$xml"; then
            echo "Error: Test failures or errors found"
            exit 1
          else
            echo "All tests passed successfully"
            exit 0
          fi

  upload_report:
    name: Compile Report
    runs-on: ubuntu-latest
    needs: [run_test]
    if: always()
    steps:
      - name: Checkout source
        uses: actions/checkout@v2
        with:
          submodules: true
          path: behavior1k-src
      - name: Pull reports
        uses: actions/download-artifact@v4
        with:
          path: behavior1k-src/OmniGibson
          merge-multiple: true
      - name: Test Report
        uses: dorny/test-reporter@v1
        with:
          name: Test Results
          working-directory: behavior1k-src/OmniGibson
          path: test_*.xml
          reporter: java-junit
          fail-on-error: 'false'
          fail-on-empty: 'false'

      # - name: Upload coverage to Codecov
      #   uses: codecov/codecov-action@v2.1.0
      #   with:
      #     token: ${{ secrets.CODECOV_TOKEN }}
