# TEMPORARY: trace RTX resource-descriptor usage of test_transition_rules on CI GPUs. Delete with the branch.
name: tmp descriptor trace

on:
  push:
    branches:
      - tmp/descriptor-trace

jobs:
  trace:
    name: Trace descriptors (${{ matrix.copy }})
    runs-on: [self-hosted, linux, gpu, dataset-enabled]
    strategy:
      fail-fast: false
      matrix:
        copy: [1, 2, 3]
    defaults:
      run:
        working-directory: ${{ github.workspace }}/OmniGibson

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install BDDL
        run: conda run -n behavior --no-capture-output pip install -e .
        working-directory: ${{ github.workspace }}/bddl3

      - name: Install OmniGibson
        run: conda run -n behavior --no-capture-output pip install -e .[dev,primitives,eval] --no-build-isolation

      - name: Get gdb
        run: |
          if command -v gdb >/dev/null; then
            echo "GDB=$(command -v gdb)" >> "$GITHUB_ENV"
          else
            conda create -y -p "$RUNNER_TEMP/gdbenv" -c conda-forge gdb
            echo "GDB=$RUNNER_TEMP/gdbenv/bin/gdb" >> "$GITHUB_ENV"
          fi

      - name: Plugin identity
        run: |
          nvidia-smi --query-gpu=name,driver_version,memory.total --format=csv
          find "$(conda run -n behavior python -c 'import isaacsim,os;print(os.path.dirname(isaacsim.__file__))')" \
            -name libgpu.foundation.plugin.so -exec sha256sum {} \;
          echo "local reference: 674d68c49b5e37ac53c69fd1536af821ae41f82db0089a05229441f271e6212b"

      - name: Run test_transition_rules under gdb tracer
        continue-on-error: true
        timeout-minutes: 45
        env:
          OMNIGIBSON_HEADLESS: "1"
          DESC_GDB_LOG: ${{ github.workspace }}/OmniGibson/gdb_desc.log
        run: |
          PY=$(conda run -n behavior which python)
          conda run -n behavior --no-capture-output "$GDB" -q -batch -nx \
            -ex "set pagination off" -ex "set confirm off" \
            -ex "set print thread-events off" -ex "set print inferior-events off" \
            -ex "handle SIGSEGV SIGBUS SIGPIPE SIGUSR1 SIGUSR2 SIG32 SIG33 SIG34 SIG35 SIG36 nostop noprint pass" \
            -ex "set auto-load safe-path /" -ex "set debuginfod enabled off" \
            -x tests/tmp_descprobe/gdb_desc.py -ex run \
            --args "$PY" -m pytest -s -q tests/test_transition_rules.py

      - name: Show trace
        if: always()
        run: |
          echo "lines: $(wc -l < gdb_desc.log)"
          grep -E "bp set|MISMATCH|FAIL|no base" gdb_desc.log || true
          echo "--- head"; head -20 gdb_desc.log
          echo "--- tail"; tail -40 gdb_desc.log

      - name: Upload trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.run_id }}-descriptor-trace-${{ matrix.copy }}
          path: OmniGibson/gdb_desc.log
          overwrite: true
