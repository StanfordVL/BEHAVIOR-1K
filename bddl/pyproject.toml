[build-system]
# setuptools>=61.0 provides PEP 660 support for editable installs; use a minimal working version here.
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bddl"
version = "3.7.0"
description = "BEHAVIOR-1K dataset package"
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "Stanford University" }]
urls = { "Homepage" = "https://github.com/StanfordVL/BEHAVIOR-1K" }
requires-python = ">=3.8"
dependencies = [
  "pytest",
  "numpy",
  "networkx",
  "jupytext",
  "future",
  "nltk~=3.7"
]

[tool.setuptools]
# combine the find settings here (do not redeclare [tool.setuptools.packages.find] again)
packages = { find = { where = ["."] , exclude = ["tests*"] } }
include-package-data = true
zip-safe = false