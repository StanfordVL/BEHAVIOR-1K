# hand_teleop configuration. Tuned for the Franka + SharpaWave-right robot
# in the ARAT scene. Mirrors the knobs in the original mujoco-vr-teleop
# stack but with PhysX/OmniGibson-specific defaults.

control:
  control_hz: 60.0          # WebXR client throttles to ~60Hz; this matches it.

bridge:
  # Frame mapping (mirrors vr_sharpa_teleop's _YAW_FIX): maps WebXR local-floor
  # (Y-up, -Z forward) into robot world (Z-up, +X arm-forward, +Y left) so your
  # physical forward -> robot +X and left -> robot +Y, same as the controller path.
  # This assumes you face the robot/screen when you enter VR. If forward/back or
  # left/right feels swapped, rotate this quat by +/-90deg about Z.
  vr_to_world_quat_xyzw: [0.5, -0.5, -0.5, 0.5]
  position_sensitivity: 1.0   # >1 = arm moves more per cm of hand motion.

  # Orientation: first-frame calibration anchored to desired_start_quat, then
  # 1:1 delta tracking — identical to vr_sharpa_teleop. At t=0 the EEF sits at
  # the handshake pose (no jump); rotating your hand left rotates the robot left.
  desired_start_quat_xyzw: [0.5, 0.5, 0.5, 0.5]   # SharpaWave handshake rest pose

  # Body-frame tweak baked into the mapped wrist before calibration (the
  # teleop_rotation_offset analog). Identity by default; the calibration handles
  # the rest-pose alignment. Try 90/180deg presets if a hand rotation drives the
  # wrist the wrong way (e.g. [1,0,0,0]=180X, [0,0,0.7071,0.7071]=90Z).
  orn_align_quat_xyzw: [0.0, 0.0, 0.0, 1.0]

  skip_pinky: true            # Pinky chain runaway in PhysX; keep at home.
  close_target_clamp: 0.85    # Cap retargeted finger angles at 85% of URDF upper limit.
  workspace_sphere:           # Reachable workspace (mirrors vr_sharpa _clamp_to_workspace).
    shoulder_pos: [0.0, 0.0, 1.194]  # Franka shoulder height in robot base frame
    reach: 0.80               # conservative reach radius from the shoulder (m)
    z_min: 0.82               # floor (ARAT table-surface margin)
    z_max: 1.75               # ceiling (avoids near-vertical singularity)
    max_pos_step: 0.02        # per-step rate limit (m) — keeps IK stable

# Geometric WebXR → SharpaWave finger retargeter.
retargeter:
  finger_flex_gain: 1.0       # multiplies index/middle/ring/pinky MCP/PIP/DIP.
  thumb_flex_gain: 1.5        # Quest under-reads thumb flex.
  thumb_opp_gain: 2.0         # CMC_FE: thumb folding toward palm-front.
  thumb_aa_gain: 1.5          # CMC_AA: thumb tucking across palm.
  pinky_cmc_gain: 0.5         # palm-cupping fraction.
  abduction_gain: 1.0         # MCP_AA lateral spread gain.
  # Per-side sign flips for SharpaWave's mirrored joint axes.
  finger_abduction_sign_left:  1.0
  finger_abduction_sign_right: -1.0
  thumb_cmc_fe_sign_left:  -1.0
  thumb_cmc_fe_sign_right:  1.0
  thumb_cmc_aa_sign_left:   1.0
  thumb_cmc_aa_sign_right: -1.0

# Smoothing + rate-limiting on commanded action vectors. Same shape as
# safety.py from the source mujoco teleop.
safety:
  enabled: true
  smoothing_alpha: 0.85       # 1.0 = no smoothing; 0.6-0.9 smooths VR jitter.
  max_arm_velocity: 2.0       # rad/s on IK target's pos/orn axisangle.
  max_hand_velocity: 6.0
  max_arm_delta_per_tick: 0.10    # ~5.7° per tick.
  max_hand_delta_per_tick: 0.20   # ~11.5° per tick.
  log_clips: true
